name: Build firmware

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
          arduino-cli lib install "Adafruit GFX Library" "Adafruit SH110X" "NTPClient" "ArduinoJson@6.21.5"

      - name: Create a dummy secrets.h (the real one is never in Git)
        run: cp firmware/DeskBot/secrets.example.h firmware/DeskBot/secrets.h

      - name: Compile for NodeMCU
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --warnings default firmware/DeskBot
